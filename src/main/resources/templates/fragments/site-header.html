<header class="topbar" th:fragment="siteHeader(showStatus, showDirectoryLink)">
  <a class="brand" th:href="@{/employees}" th:attr="aria-label=#{app.brand.aria}">
    <span class="brand-mark" th:text="#{app.brand.mark}"></span>
    <span><span th:text="#{app.brand.name}"></span> <small th:text="#{app.brand.section}"></small></span>
  </a>
  <div class="topbar-tools">
    <span class="topbar-status" th:if="${showStatus}">
      <span class="status-dot"></span> <span th:text="#{app.status.internal}"></span>
    </span>
    <a class="topbar-link" th:if="${showDirectoryLink}" th:href="@{/employees}" th:text="#{employees.title}"></a>
    <nav class="language-switch" th:attr="aria-label=#{language.switch.aria}">
      <a th:href="@{/employees(lang='en')}" th:classappend="${#locale.language == 'en'} ? ' is-active' : ''"
         th:attr="aria-label=#{language.english},aria-current=${#locale.language == 'en'} ? 'page' : null">EN</a>
      <a th:href="@{/employees(lang='vi')}" th:classappend="${#locale.language == 'vi'} ? ' is-active' : ''"
         th:attr="aria-label=#{language.vietnamese},aria-current=${#locale.language == 'vi'} ? 'page' : null">VI</a>
    </nav>
  </div>
</header>
