<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|#{employees.title} · #{app.brand.name}|"></title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <header class="topbar">
    <a class="brand" th:href="@{/employees}" th:attr="aria-label=#{app.brand.aria}">
      <span class="brand-mark" th:text="#{app.brand.mark}"></span>
      <span><span th:text="#{app.brand.name}"></span> <small th:text="#{app.brand.section}"></small></span>
    </a>
    <div class="topbar-tools">
      <span class="topbar-status"><span class="status-dot"></span> <span th:text="#{app.status.internal}"></span></span>
      <nav class="language-switch" th:attr="aria-label=#{language.switch.aria}">
        <a th:href="@{/employees(lang='en')}" th:classappend="${#locale.language == 'en'} ? ' is-active' : ''"
           th:attr="aria-label=#{language.english},aria-current=${#locale.language == 'en'} ? 'page' : null">EN</a>
        <a th:href="@{/employees(lang='vi')}" th:classappend="${#locale.language == 'vi'} ? ' is-active' : ''"
           th:attr="aria-label=#{language.vietnamese},aria-current=${#locale.language == 'vi'} ? 'page' : null">VI</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-heading">
      <div>
        <p class="eyebrow" th:text="#{employees.eyebrow}"></p>
        <h1 th:text="#{employees.title}"></h1>
        <p class="heading-copy" th:text="#{employees.description}"></p>
      </div>
      <a class="button button-primary" th:href="@{/employees/new}">
        <span class="button-symbol" aria-hidden="true">+</span> <span th:text="#{employee.action.create}"></span>
      </a>
    </section>

    <div class="notice" th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
    <div class="notice notice-warning" th:if="${warningMessage}" th:text="${warningMessage}" role="alert"></div>

    <section class="directory" aria-labelledby="directory-title">
      <div class="directory-toolbar">
        <div>
          <h2 id="directory-title" th:text="#{employees.list.title}"></h2>
          <p th:text="#{employees.list.description}"></p>
        </div>
        <div class="record-count"><strong th:text="${totalEmployees}">0</strong><span th:text="#{employees.list.countLabel}"></span></div>
      </div>

      <div class="table-wrap" th:if="${!#lists.isEmpty(employees)}">
        <div class="selection-toolbar">
          <label class="select-all-control">
            <input id="select-all-employees" type="checkbox" th:attr="aria-label=#{employee.selection.selectAll.aria}">
            <span th:text="#{employee.selection.selectPage}"></span>
          </label>
          <span id="selected-employee-count" class="selection-count" aria-live="polite"
                th:attr="data-count-template=#{employee.selection.count}"></span>
          <form id="bulk-delete-form" th:action="@{/employees/delete}" method="post"
                th:attr="data-confirm-message=#{employee.bulkDelete.confirm}">
            <input type="hidden" name="page" th:value="${currentPage}">
            <button id="bulk-delete-button" class="button button-delete" type="submit" disabled>
              <span th:text="#{employee.action.deleteSelected}"></span>
            </button>
          </form>
        </div>
        <table>
          <thead>
            <tr><th th:text="#{employee.table.select}"></th><th th:text="#{employee.table.id}"></th><th th:text="#{employee.table.name}"></th><th th:text="#{employee.table.age}"></th><th class="actions-heading" th:text="#{employee.table.actions}"></th></tr>
          </thead>
          <tbody>
            <tr th:each="employee : ${employees}">
              <td>
                <input class="employee-select" type="checkbox" name="ids" form="bulk-delete-form"
                       th:value="${employee.empId}" th:attr="aria-label=#{employee.selection.selectOne(${employee.empName})}">
              </td>
              <td class="employee-id" th:text="${#numbers.formatInteger(employee.empId, 4)}"></td>
              <td>
                <div class="person-cell">
                  <span class="avatar" th:text="${#strings.substring(employee.empName, 0, 1).toUpperCase()}"></span>
                  <span class="person-name" th:text="${employee.empName}"></span>
                </div>
              </td>
              <td><span class="age-value" th:text="${employee.age}"></span><span class="age-unit" th:text="#{employee.age.unit}"></span></td>
              <td class="row-actions">
                <a class="text-action" th:href="@{/employees/{id}/edit(id=${employee.empId})}" th:text="#{employee.action.edit}"></a>
                <form th:action="@{/employees/{id}/delete(id=${employee.empId})}" method="post"
                      class="single-delete-form" th:attr="data-confirm-message=#{employee.delete.confirm}">
                  <input type="hidden" name="page" th:value="${currentPage}">
                  <button class="text-action text-danger" type="submit" th:text="#{employee.action.delete}"></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="empty-state" th:if="${#lists.isEmpty(employees)}">
        <span class="empty-mark" aria-hidden="true">—</span>
        <h3 th:text="#{employees.empty.title}"></h3>
        <p th:text="#{employees.empty.description}"></p>
        <a class="button button-secondary" th:href="@{/employees/new}" th:text="#{employees.empty.action}"></a>
      </div>

      <nav class="pagination" th:if="${totalPages > 1}" th:attr="aria-label=#{employees.pagination.aria}">
        <a class="page-link page-step" th:if="${hasPrevious}" th:href="@{/employees(page=${currentPage - 1})}" th:text="#{employees.pagination.previous}"></a>
        <span class="page-link page-step is-disabled" th:unless="${hasPrevious}" aria-disabled="true" th:text="#{employees.pagination.previous}"></span>
        <a class="page-link" th:each="pageNumber : ${#numbers.sequence(firstPage, lastPage)}"
           th:href="@{/employees(page=${pageNumber})}"
           th:classappend="${pageNumber == currentPage} ? ' is-current' : ''"
           th:attr="aria-current=${pageNumber == currentPage} ? 'page' : null"
           th:text="${pageNumber + 1}"></a>
        <span class="page-summary" th:text="|${currentPage + 1} / ${totalPages}|"></span>
        <a class="page-link page-step" th:if="${hasNext}" th:href="@{/employees(page=${currentPage + 1})}" th:text="#{employees.pagination.next}"></a>
        <span class="page-link page-step is-disabled" th:unless="${hasNext}" aria-disabled="true" th:text="#{employees.pagination.next}"></span>
      </nav>
      <footer class="directory-footer"><span th:text="#{app.brand.name}"></span><span th:text="#{employees.footer}"></span></footer>
    </section>
  </main>
  <script>
    (() => {
      const bulkForm = document.getElementById("bulk-delete-form");
      if (!bulkForm) return;

      const rowCheckboxes = Array.from(document.querySelectorAll(".employee-select"));
      const selectAll = document.getElementById("select-all-employees");
      const deleteButton = document.getElementById("bulk-delete-button");
      const selectedCount = document.getElementById("selected-employee-count");

      const updateSelection = () => {
        const checkedCount = rowCheckboxes.filter((checkbox) => checkbox.checked).length;
        deleteButton.disabled = checkedCount === 0;
        selectedCount.textContent = selectedCount.dataset.countTemplate.replace("{0}", checkedCount);
        selectAll.checked = rowCheckboxes.length > 0 && checkedCount === rowCheckboxes.length;
        selectAll.indeterminate = checkedCount > 0 && checkedCount < rowCheckboxes.length;
      };

      selectAll.addEventListener("change", () => {
        rowCheckboxes.forEach((checkbox) => { checkbox.checked = selectAll.checked; });
        updateSelection();
      });
      rowCheckboxes.forEach((checkbox) => checkbox.addEventListener("change", updateSelection));
      bulkForm.addEventListener("submit", (event) => {
        const checkedCount = rowCheckboxes.filter((checkbox) => checkbox.checked).length;
        if (checkedCount === 0 || !confirm(bulkForm.dataset.confirmMessage)) {
          event.preventDefault();
        }
      });
      document.querySelectorAll(".single-delete-form").forEach((form) => {
        form.addEventListener("submit", (event) => {
          if (!confirm(form.dataset.confirmMessage)) event.preventDefault();
        });
      });
      updateSelection();
    })();
  </script>
</body>
</html>
