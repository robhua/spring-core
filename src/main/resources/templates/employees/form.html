<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::pageTitle}, ~{fragments/site-header :: siteHeader(false, true)}, ~{::pageContent}, ~{::pageStyles}, ~{::pageScripts})}">
<head>
  <title th:fragment="pageTitle" th:text="|${pageTitle} · #{app.brand.name}|"></title>
  <th:block th:fragment="pageStyles">
    <link rel="stylesheet" th:href="@{/css/pages/employee-management.css}">
  </th:block>
</head>
<body>
  <main class="page-shell form-shell" th:fragment="pageContent">
    <a class="back-link" th:href="@{/employees}"><span aria-hidden="true">←</span> <span th:text="#{employee.form.back}"></span></a>
    <section class="form-layout">
      <div class="form-intro">
        <p class="eyebrow" th:text="#{employee.form.eyebrow}"></p>
        <h1 th:text="${pageTitle}"></h1>
        <p th:text="#{employee.form.description}"></p>
        <div class="form-index"><span>01</span><span th:text="#{employee.form.section}"></span></div>
      </div>

      <form class="employee-form" th:action="${formAction}" th:object="${employee}" method="post">
        <div class="field-group">
            <label for="empName"><span th:text="#{employee.field.name}"></span> <span>*</span></label>
          <input id="empName" type="text" th:field="*{empName}" maxlength="255"
               th:placeholder="#{employee.field.name.placeholder}" autocomplete="name" required>
          <small class="field-error" th:if="${#fields.hasErrors('empName')}" th:errors="*{empName}"></small>
        </div>
        <div class="field-group field-age">
          <label for="age"><span th:text="#{employee.field.age}"></span> <span>*</span></label>
          <div class="age-input-wrap">
            <input id="age" type="number" th:field="*{age}" min="0" max="120" required>
            <span th:text="#{employee.age.unit}"></span>
          </div>
          <small class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></small>
        </div>
        <div class="form-actions">
          <a class="button button-quiet" th:href="@{/employees}" th:text="#{common.cancel}"></a>
          <button class="button button-primary" type="submit" th:text="${submitLabel}"></button>
        </div>
      </form>
    </section>
    <p class="form-note"><span>*</span> <span th:text="#{form.required.note}"></span></p>
  </main>
  <th:block th:fragment="pageScripts"></th:block>
</body>
</html>
